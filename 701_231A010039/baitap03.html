<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 3 - Countdown Timer</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .timer-display {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            margin: 2rem 0;
        }
        /* Animation khi thời gian dưới 1 phút (< 60s) */
        @keyframes pulseWarning {
            0% { color: #e74c3c; transform: scale(1); }
            50% { color: #c0392b; transform: scale(1.05); }
            100% { color: #e74c3c; transform: scale(1); }
        }
        .warning-anim {
            animation: pulseWarning 1s infinite;
        }
        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">701-DH23501</div>
            <nav>
                <ul>
                    <li><a href="index.html">Trang Chủ</a></li>
                    <li><a href="lythuyet.html">a) Trả lời Lý thuyết</a></li>
                    <li><a href="baitap01.html">Bài Tập 1</a></li>
                    <li><a href="baitap22.html">c) Bài Tập 22</a></li>
                    <li><a href="baitap23.html">b) Bài Tập 23</a></li>
                    <li><a href="diemdanh.html">d) Điểm Danh</a></li>
                    <li><a href="about.html">Giới Thiệu</a></li>
                    <li><a href="contact.html">Liên Hệ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="card" style="text-align: center;">
            <h1>Đồng Hồ Đếm Ngược (10 Phút)</h1>
            <div id="timer" class="timer-display">10:00</div>
            <button id="startBtn">Bắt Đầu</button>
            <button id="resetBtn" style="background-color: #95a5a6; margin-left: 1rem;">Đặt Lại</button>
        </section>
    </main>

    <!-- Modal thông báo hết giờ -->
    <div id="timeUpModal" class="modal">
        <div class="modal-content">
            <h2>Hết Giờ!</h2>
            <p>Thời gian làm bài đã kết thúc.</p>
            <button onclick="location.reload()">Làm lại</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 - MSSV: 701-DH23501 - Lập Trình Web</p>
    </footer>

    <script>
        let totalSeconds = 10 * 60; // 10 phút
        let timerInterval = null;
        const timerDisplay = document.getElementById("timer");
        const startBtn = document.getElementById("startBtn");
        const resetBtn = document.getElementById("resetBtn");
        const timeUpModal = document.getElementById("timeUpModal");

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60);
            const seconds = secs % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return; // Tránh tạo nhiều interval gây memory leak
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    timerDisplay.textContent = formatTime(totalSeconds);
                    if (totalSeconds < 60) {
                        timerDisplay.classList.add("warning-anim");
                    }
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timeUpModal.style.display = "flex";
                }
            }, 1000);
        }

        startBtn.addEventListener("click", startTimer);
        resetBtn.addEventListener("click", () => {
            clearInterval(timerInterval);
            timerInterval = null;
            totalSeconds = 10 * 60;
            timerDisplay.textContent = formatTime(totalSeconds);
            timerDisplay.classList.remove("warning-anim");
            timeUpModal.style.display = "none";
        });
    </script>
</body>
</html>
